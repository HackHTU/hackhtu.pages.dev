<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hack HTU｜学习通签到与位置模拟教程</title>
    <meta
      name="description"
      content="学习通签到类型、浏览器定位调试、Android 与 iOS 位置模拟测试教程。仅用于合规的开发测试与故障排查。"
    />
    <meta property="og:title" content="Hack HTU｜学习通签到与位置模拟教程" />
    <meta
      property="og:description"
      content="学习通签到类型、浏览器定位调试、Android 与 iOS 位置模拟测试教程。仅用于合规的开发测试与故障排查。"
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon-180x180.png"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // 自动跟随系统深浅色偏好，并在系统切换时实时同步。
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const apply = (isDark) => {
          document.documentElement.classList.toggle("dark", isDark);
        };

        apply(query.matches);
        query.addEventListener("change", (event) => {
          apply(event.matches);
        });
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hack HTU" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
