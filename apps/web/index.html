    <meta property="og:title" content="Hack HTU｜河师大学生工具站" />
    <meta
      property="og:description"
      content="河南师范大学学生工具站：课程评价查询、学校新闻、请假条生成、跨平台位置模拟教程、校园网一键登录脚本、校园生活地图、校园树洞墙和意见反馈，打开就能用，不用注册。"
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon-180x180.png"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // 自动跟随系统深浅色偏好，并在系统切换时实时同步。
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const apply = (isDark) => {
          document.documentElement.classList.toggle("dark", isDark);
        };

        apply(query.matches);
        query.addEventListener("change", (event) => {
          apply(event.matches);
        });
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hack HTU" />
  </head>
